[package]
name = "exhume_agent"
version = "0.1.3"
edition = "2021"
description = "Embeddable autonomous forensic assistant runtime and CLI for the Exhume framework."
repository = "https://github.com/forensicxlab/exhume_agent"
documentation = "https://github.com/forensicxlab/exhume_agent"
authors = ["Thanatology Assistant", "k1nd0ne"]
license = "GPL-3.0-only"

[lib]
name = "exhume_agent"
path = "src/lib.rs"

[[bin]]
name = "exhume-agent"
path = "src/main.rs"
required-features = ["tui"]

[features]
default = ["tui"]
tui = [
    "dep:clap",
    "dep:colored",
    "dep:crossterm",
    "dep:dotenvy",
    "dep:futures",
    "dep:indicatif",
    "dep:ratatui",
    "dep:tracing-subscriber",
]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI and configuration
clap = { version = "4.4", features = ["derive", "env"], optional = true }
dotenvy = { version = "0.15", optional = true }

# Terminal output
colored = { version = "2.1", optional = true }

# LLM Framework
rig-core = "=0.31.0"

# Error handling and tracing
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# Exhume Core dependencies
exhume_body = "=0.5.7"
exhume_partitions = "=0.3.12"
exhume_filesystem = "=0.5.4"
exhume_lvm = "=0.1.11"
exhume_indexer = "=0.2.2"

# Database
sqlx = { version = "0.8.2", features = ["sqlite", "runtime-tokio"] }
exhume_artefacts = "=0.3.2"
hex = "0.4"
reqwest = { version = "0.13.2", features = ["blocking", "json", "multipart"] }
tempfile = "3.26.0"
base64 = "0.22.1"
log = "0.4.29"
sha2 = "0.10"
tokio-util = "0.7"
indicatif = { version = "0.17", optional = true }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", features = ["event-stream"], optional = true }
futures = { version = "0.3", optional = true }
futures-util = "0.3"
